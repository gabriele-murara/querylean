[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querylean"
# The version is read only from the .version file.
dynamic = ["version"]
description = "Client desktop minimale per eseguire query MySQL di sola lettura"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriele Murara" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6,<7",
    "mysql-connector-python>=9.3,<10",
    "sqlglot>=25,<27",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
querylean = "querylean.app.application:Application.run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: richiede un'istanza MySQL di test (variabili QUERYLEAN_TEST_*)"]

[tool.setuptools.dynamic]
version = { file = ".version" }

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The coding style requires str.format() instead of f-strings (see CLAUDE.md).
ignore = ["UP032"]
