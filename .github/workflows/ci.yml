name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint e test (Linux)
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QT_QPA_PLATFORM: offscreen
      QUERYLEAN_TEST_HOST: 127.0.0.1
      QUERYLEAN_TEST_PORT: "3306"
      QUERYLEAN_TEST_DATABASE: querylean_test
      QUERYLEAN_TEST_USER: querylean_ro
      QUERYLEAN_TEST_PASSWORD: querylean_ro_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Librerie di sistema per Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        run: pip install -e ".[dev,build]"
      - name: Lint
        run: |
          ruff check src tests packaging
          ruff format --check src tests packaging
      - name: Database di test
        run: |
          mysql -h 127.0.0.1 -uroot -proot < tests/integration/setup_test_db.sql
          # Dal container il runner non appare come localhost: account dedicato per la CI.
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'querylean_ro'@'%' IDENTIFIED BY 'querylean_ro_password';
            GRANT SELECT ON querylean_test.* TO 'querylean_ro'@'%';"
      - name: Test unitari, GUI e integrazione
        run: pytest -v

  package-linux:
    name: AppImage (Linux x86_64)
    needs: test
    runs-on: ubuntu-22.04  # glibc più vecchia supportata = compatibilità più ampia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file
      - run: pip install -e ".[build]"
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/build_linux_appimage.sh
      - name: Smoke test dell'AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: timeout 30 dist/querylean-*.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  package-deb:
    name: Pacchetto .deb (Ubuntu/Lubuntu 24.04 amd64)
    needs: test
    runs-on: ubuntu-24.04  # stessa glibc del sistema di destinazione
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[build]"
      - name: Build
        run: packaging/build_linux_deb.sh
      - name: Installazione del pacchetto (risolve le dipendenze)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/querylean-*.deb
      - name: Smoke test del pacchetto installato
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 30 querylean --smoke-test
      - name: Rimozione pulita
        run: |
          sudo apt-get remove -y querylean
          test ! -e /opt/querylean && test ! -e /usr/bin/querylean
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

  package-macos:
    name: DMG (macOS ${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[build]"
      - run: packaging/build_macos_dmg.sh
      - name: Smoke test del binario
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/QueryLean.app/Contents/MacOS/querylean" --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
