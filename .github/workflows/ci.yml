name: CI

on:
  push:
    # release-*: verifica dei pacchetti prima del merge in main.
    branches: [main, "release-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Librerie del plugin xcb di Qt: devono essere presenti sulla macchina di
  # build perché PyInstaller le includa nel pacchetto (BundleSlimmer
  # .check_required_libraries fa fallire la build se mancano).
  QT_XCB_PACKAGES: >-
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1
    libxkbcommon-x11-0

jobs:
  test:
    name: Lint e test (Linux)
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QT_QPA_PLATFORM: offscreen
      QUERYLEAN_TEST_HOST: 127.0.0.1
      QUERYLEAN_TEST_PORT: "3306"
      QUERYLEAN_TEST_DATABASE: querylean_test
      QUERYLEAN_TEST_USER: querylean_ro
      QUERYLEAN_TEST_PASSWORD: querylean_ro_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Librerie di sistema per Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        run: pip install -e ".[dev,build]"
      - name: Lint
        run: |
          ruff check src tests packaging
          ruff format --check src tests packaging
      - name: Database di test
        run: |
          mysql -h 127.0.0.1 -uroot -proot < tests/integration/setup_test_db.sql
          # Dal container il runner non appare come localhost: account dedicato per la CI.
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'querylean_ro'@'%' IDENTIFIED BY 'querylean_ro_password';
            GRANT SELECT ON querylean_test.* TO 'querylean_ro'@'%';"
      - name: Test unitari, GUI e integrazione
        run: pytest -v

  package-linux:
    name: AppImage (Linux x86_64)
    needs: test
    runs-on: ubuntu-22.04  # glibc più vecchia supportata = compatibilità più ampia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file \
            desktop-file-utils $QT_XCB_PACKAGES
      - run: pip install -e ".[build]"
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          packaging/build_linux_appimage.sh
          # Licenze di terze parti dell'AppImage, allegate alla release.
          APPIMAGE="$(ls dist/querylean-*.AppImage)"
          cp dist/querylean/_internal/licenses/THIRD_PARTY_LICENSES.txt \
            "${APPIMAGE}.THIRD_PARTY_LICENSES.txt"
      - name: Smoke test dell'AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: timeout 30 dist/querylean-*.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  package-deb:
    name: Pacchetto .deb (Ubuntu/Lubuntu 24.04 amd64)
    needs: test
    runs-on: ubuntu-24.04  # stessa glibc del sistema di destinazione
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Librerie di sistema per Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y $QT_XCB_PACKAGES
      - run: pip install -e ".[build]"
      - name: Build
        run: packaging/build_linux_deb.sh
      - name: Installazione del pacchetto (risolve le dipendenze)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/querylean-*.deb
      - name: Smoke test del pacchetto installato
        env:
          QT_QPA_PLATFORM: offscreen
        # Percorso esplicito: nel PATH c'è anche il comando installato da pip.
        run: timeout 30 /usr/bin/querylean --smoke-test
      - name: Rimozione pulita
        run: |
          sudo apt-get remove -y querylean
          test ! -e /opt/querylean && test ! -e /usr/bin/querylean
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  package-macos:
    name: DMG (macOS ${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[build]"
      - run: packaging/build_macos_dmg.sh
      - name: Smoke test del binario
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/QueryLean.app/Contents/MacOS/querylean" --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Release su GitHub
    # Solo per i tag di versione (vX.Y.Z), dopo che tutti i pacchetti sono
    # stati costruiti e verificati.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-deb, package-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Il tag corrisponde a .version
        run: |
          VERSION="$(tr -d '[:space:]' < .version)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Il tag ${GITHUB_REF_NAME} non corrisponde a .version (${VERSION})" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksum
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Pubblicazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un tag con trattino (es. vX.Y.Z-rc1) diventa una pre-release.
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag --generate-notes $PRERELEASE \
            --title "QueryLean ${GITHUB_REF_NAME#v}"
